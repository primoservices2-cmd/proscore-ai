<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProScore AI — Premium Sports Predictions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: { 600:'#334155', 700:'#1e293b', 800:'#0f172a', 900:'#020617', 950:'#010309' },
            neon: { green:'#39FF14', blue:'#00D4FF', purple:'#BF40BF' },
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family:'Inter',system-ui,sans-serif; }
    .glass { background:rgba(15,23,42,0.6); backdrop-filter:blur(12px); border:1px solid rgba(30,41,59,0.5); border-radius:1rem; }
    .neon { color:#39FF14; text-shadow:0 0 10px rgba(57,255,20,0.5); }
    .grad { background:linear-gradient(90deg,#39FF14,#00D4FF); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .pw-wrap { position:relative; }
    .pw-toggle { position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color:#64748b; background:none; border:none; }
    .pw-toggle:hover { color:#39FF14; }
  </style>
</head>

<body class="bg-dark-900 text-slate-100 min-h-screen">

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 border-b border-dark-800 bg-dark-900/80 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
      <a href="/" class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gradient-to-br from-neon-green to-neon-blue rounded-lg flex items-center justify-center font-black text-dark-900">PS</div>
        <span class="text-xl font-black text-white">Pro<span class="text-neon-green">Score</span></span>
      </a>
      <div class="flex items-center gap-3">
        <div id="adminNavBtn" class="hidden">
          <button onclick="toggleAdminPanel()" class="px-3 py-1.5 bg-neon-purple/20 border border-neon-purple/50 rounded-xl text-xs font-bold text-neon-purple hover:bg-neon-purple/30">
            ⚙️ Panneau Admin
          </button>
        </div>
        <div id="authArea" class="flex items-center gap-2"></div>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="relative overflow-hidden py-12 text-center border-b border-dark-800">
    <h1 class="text-4xl md:text-6xl font-black mb-3"><span class="text-white">Pro</span><span class="grad">Score</span><span class="text-white"> AI</span></h1>
    <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">Pronostics sportifs haute précision alimentés par intelligence artificielle.</p>
  </section>

  <!-- PANNEAU ADMIN (Directement intégré) -->
  <div id="adminSection" class="hidden max-w-7xl mx-auto px-4 py-8 border-b border-dark-700 bg-dark-950/80">
    <div class="glass p-6 border-neon-purple/30">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold text-white flex items-center gap-2">⚙️ Panneau Administration <span class="text-xs px-2 py-0.5 bg-neon-purple/20 text-neon-purple rounded-full">ADMIN</span></h2>
        <button onclick="toggleAdminPanel()" class="text-slate-400 hover:text-white">✕ Fermer</button>
      </div>

      <div class="grid md:grid-cols-2 gap-6">
        <!-- Formulaire de création de match & pronostic -->
        <div class="space-y-4">
          <h3 class="text-lg font-bold text-neon-green">➕ Publier un nouveau Pronostic</h3>
          <form onsubmit="adminCreatePrediction(event)" class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
              <select id="admSport" required class="p-2.5 bg-dark-800 border border-dark-600 rounded-xl text-sm">
                <option value="football">⚽ Football</option>
                <option value="basketball">🏀 Basketball</option>
                <option value="tennis">🎾 Tennis</option>
                <option value="hockey">🏒 Hockey</option>
                <option value="american_football">🏈 Foot US</option>
              </select>
              <input type="text" id="admLeague" placeholder="Ligue (ex: Ligue 1)" required class="p-2.5 bg-dark-800 border border-dark-600 rounded-xl text-sm" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" id="admHome" placeholder="Équipe Domicile" required class="p-2.5 bg-dark-800 border border-dark-600 rounded-xl text-sm" />
              <input type="text" id="admAway" placeholder="Équipe Extérieur" required class="p-2.5 bg-dark-800 border border-dark-600 rounded-xl text-sm" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input type="datetime-local" id="admDate" required class="p-2.5 bg-dark-800 border border-dark-600 rounded-xl text-sm" />
              <select id="admTier" class="p-2.5 bg-dark-800 border border-dark-600 rounded-xl text-sm">
                <option value="silver">🥈 Silver</option>
                <option value="gold" selected>🥇 Gold</option>
                <option value="vip">💎 VIP</option>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" id="adm1X2" placeholder="1X2 (1, X, ou 2)" class="p-2.5 bg-dark-800 border border-dark-600 rounded-xl text-sm" />
              <input type="text" id="admScore" placeholder="Score Exact (ex: 2-1)" class="p-2.5 bg-dark-800 border border-dark-600 rounded-xl text-sm" />
            </div>
            <input type="text" id="admGoals" placeholder="Total Buts (ex: Over 2.5)" class="w-full p-2.5 bg-dark-800 border border-dark-600 rounded-xl text-sm" />
            <button type="submit" class="w-full py-3 bg-neon-green text-dark-900 font-bold rounded-xl hover:opacity-90">🚀 Publier Immédiatement</button>
          </form>
        </div>

        <!-- Liste des utilisateurs -->
        <div>
          <h3 class="text-lg font-bold text-neon-blue mb-3">👥 Liste des Utilisateurs</h3>
          <div id="adminUsersList" class="space-y-2 max-h-80 overflow-y-auto pr-2">
            <p class="text-slate-500 text-sm">Chargement des utilisateurs...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- DASHBOARD PUBLIC -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div id="sportTabs" class="flex items-center gap-2 overflow-x-auto pb-4"></div>
    <div id="msgArea"></div>
    <div id="matchesBox" class="space-y-8"></div>
    <div id="loader" class="text-center py-12"><div class="inline-block animate-spin h-8 w-8 border-4 border-neon-green border-t-transparent rounded-full"></div></div>
  </main>

  <!-- AUTH MODAL -->
  <div id="authModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass p-8 w-full max-w-md">
      <div class="flex items-center justify-between mb-6">
        <h3 id="authTitle" class="text-2xl font-bold text-white">Connexion</h3>
        <button onclick="closeModal()" class="text-slate-400 text-2xl">×</button>
      </div>
      <div id="authErr" class="hidden p-3 bg-red-900/30 border border-red-500/30 rounded-xl text-red-400 text-sm mb-4"></div>

      <form onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
          <input type="email" id="authEmail" required placeholder="votre@email.com" class="w-full p-3 bg-dark-800 border border-dark-600 rounded-xl text-white" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Mot de passe</label>
          <div class="pw-wrap">
            <input type="password" id="authPw" required placeholder="••••••••" class="w-full p-3 pr-12 bg-dark-800 border border-dark-600 rounded-xl text-white" />
            <button type="button" class="pw-toggle" onclick="toggleEye('authPw', this)">👁️</button>
          </div>
        </div>
        <button type="submit" id="authBtn" class="w-full py-3 bg-gradient-to-r from-neon-green to-neon-blue text-dark-900 font-bold rounded-xl">Se connecter</button>
      </form>
      <p class="text-center text-sm text-slate-400 mt-4">
        <span id="switchTxt">Pas de compte ?</span>
        <button onclick="flipMode()" class="text-neon-green hover:underline ml-1" id="switchBtn">S'inscrire</button>
      </p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://obkqpaiqccreoinxgodo.supabase.co'; // ⚠️ Remplacer si besoin
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ia3FwYWlxY2NyZW9pbnhnb2RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MDExMDksImV4cCI6MjEwNTA3NzEwOX0.iGabaA_ylID4S8CqeC1gpdjs9Px3R3ixauwQOOfmejg';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    let user = null, profile = null, sport = 'all', mode = 'login';

    function toggleEye(id, btn) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function openModal(m) {
      mode = m;
      document.getElementById('authModal').classList.remove('hidden');
      document.getElementById('authTitle').innerText = m === 'login' ? 'Connexion' : 'Inscription';
      document.getElementById('authBtn').innerText = m === 'login' ? 'Se connecter' : "S'inscrire";
    }
    function closeModal() { document.getElementById('authModal').classList.add('hidden'); }
    function flipMode() { openModal(mode === 'login' ? 'register' : 'login'); }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPw').value;
      const errEl = document.getElementById('authErr');
      errEl.classList.add('hidden');

      try {
        if (mode === 'register') {
          const { data, error } = await db.auth.signUp({ email, password });
          if (error) throw error;
          if (data.user) {
            await db.from('users').upsert({ id: data.user.id, email, role: 'free', password_hash: 'managed' });
          }
          alert('Compte créé ! Vous pouvez vous connecter.');
          openModal('login');
        } else {
          const { data, error } = await db.auth.signInWithPassword({ email, password });
          if (error) throw error;
          user = data.user;
          await loadProfile();
          closeModal();
        }
      } catch (err) {
        errEl.innerText = err.message;
        errEl.classList.remove('hidden');
      }
    }

    async function loadProfile() {
      if (!user) return;
      const { data } = await db.from('users').select('*').eq('id', user.id).maybeSingle();
      profile = data || { role: 'free' };

      // Si c'est un ADMIN -> afficher le bouton admin
      if (profile.role === 'admin') {
        document.getElementById('adminNavBtn').classList.remove('hidden');
        loadAdminUsers();
      } else {
        document.getElementById('adminNavBtn').classList.add('hidden');
      }
      renderAuth();
      loadMatches();
    }

    function toggleAdminPanel() {
      document.getElementById('adminSection').classList.toggle('hidden');
    }

    async function adminCreatePrediction(e) {
      e.preventDefault();
      try {
        const { data: m, error: e1 } = await db.from('matches').insert([{
          sport: document.getElementById('admSport').value,
          league_name: document.getElementById('admLeague').value,
          team_home: document.getElementById('admHome').value,
          team_away: document.getElementById('admAway').value,
          match_date: new Date(document.getElementById('admDate').value).toISOString(),
          status: 'scheduled'
        }]).select().single();
        if (e1) throw e1;

        const { error: e2 } = await db.from('predictions').insert([{
          match_id: m.id,
          tier_required: document.getElementById('admTier').value,
          final_result: document.getElementById('adm1X2').value || null,
          exact_score: document.getElementById('admScore').value || null,
          total_goals_points: document.getElementById('admGoals').value || null,
          confidence_pct: 80
        }]);
        if (e2) throw e2;

        alert('✅ Pronostic publié avec succès !');
        e.target.reset();
        loadMatches();
      } catch (err) { alert('❌ Erreur: ' + err.message); }
    }

    async function loadAdminUsers() {
      const { data } = await db.from('users').select('*').limit(20);
      if (!data) return;
      document.getElementById('adminUsersList').innerHTML = data.map(u => `
        <div class="p-2.5 bg-dark-800 rounded-xl flex items-center justify-between text-xs">
          <div><p class="font-bold text-white">${u.email}</p><p class="text-slate-400">${u.role}</p></div>
          ${u.role !== 'admin' ? `<button onclick="makeUserAdmin('${u.id}')" class="px-2 py-1 bg-neon-purple/20 text-neon-purple rounded">Promouvoir Admin</button>` : '<span class="text-neon-green">Admin ✅</span>'}
        </div>
      `).join('');
    }

    async function makeUserAdmin(uid) {
      await db.from('users').update({ role: 'admin' }).eq('id', uid);
      loadAdminUsers();
    }

    async function logout() {
      await db.auth.signOut();
      user = null; profile = null;
      document.getElementById('adminNavBtn').classList.add('hidden');
      document.getElementById('adminSection').classList.add('hidden');
      renderAuth();
      loadMatches();
    }

    function renderAuth() {
      const a = document.getElementById('authArea');
      if (user) {
        a.innerHTML = `<span class="text-xs text-slate-300 font-bold hidden sm:inline">${user.email}</span>
                       <button onclick="logout()" class="text-xs text-red-400 hover:underline">Déconnexion</button>`;
      } else {
        a.innerHTML = `<button onclick="openModal('login')" class="text-sm text-slate-300">Connexion</button>
                       <button onclick="openModal('register')" class="px-3 py-1.5 bg-neon-green text-dark-900 font-bold rounded-xl text-sm">Inscription</button>`;
      }
    }

    async function loadMatches() {
      document.getElementById('loader').classList.remove('hidden');
      try {
        let q = db.from('matches').select(`*, predictions(*)`);
        if (sport !== 'all') q = q.eq('sport', sport);
        const { data, error } = await q;
        if (error) throw error;
        document.getElementById('loader').classList.add('hidden');
        renderMatches(data || []);
      } catch (err) {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('msgArea').innerHTML = `<div class="p-3 bg-red-900/30 text-red-400 rounded-xl text-center text-sm">${err.message}</div>`;
      }
    }

    function renderMatches(data) {
      const box = document.getElementById('matchesBox');
      if (!data.length) { box.innerHTML = '<p class="text-center text-slate-500">Aucun match disponible.</p>'; return; }
      box.innerHTML = data.map(m => {
        const p = m.predictions?.[0];
        const isLocked = profile?.role !== 'admin' && profile?.role !== 'subscriber';
        return `
          <div class="glass p-5">
            <div class="flex justify-between text-xs text-slate-400 mb-2 font-bold"><span>${m.league_name}</span><span>${m.sport.toUpperCase()}</span></div>
            <div class="flex justify-between items-center mb-4"><span class="text-lg font-bold">${m.team_home} vs ${m.team_away}</span><span class="text-xs bg-dark-700 px-2 py-1 rounded">${new Date(m.match_date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>
            ${p ? `
              <div class="bg-dark-800 p-3 rounded-xl space-y-2">
                <p class="text-xs text-slate-400">1X2: <b class="text-neon-green">${p.final_result || 'N/A'}</b></p>
                <p class="text-xs text-slate-400">Score Exact: ${isLocked ? '<span class="text-amber-400">🔒 Reservé Abonnés</span>' : `<b class="text-neon-green">${p.exact_score}</b>`}</p>
              </div>
            ` : '<p class="text-xs text-slate-500">Pas encore de pronostic</p>'}
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session?.user) { user = session.user; await loadProfile(); }
      renderAuth();
      loadMatches();
    });
  </script>
</body>
</html>
